name: Nullgate 1.21.11 Staging Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_self_hosted:
        description: 'Also run an isolated self-hosted soak test (requires runner label nullgate-lab and dependencies)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: nullgate-staging-${{ github.ref }}
  cancel-in-progress: true
jobs:
  jar-and-offline-qa:
    name: Integrity and three-pass JVM QA
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify JAR and smoke-test parser
        run: |
          python3 scripts/verify_release.py
          python3 -m unittest discover -s tests -v
      - name: Run archived three-pass QA and reproducible rebuild
        shell: bash
        run: |
          mkdir -p ci-qa
          unzip -q test-assets/alpha421-source-and-qa.zip -d ci-qa
          bash ci-qa/Nullgate-alpha421-source/BUILD-AND-QA-LINUX.sh
          test "$(sha256sum Nullgate-0.1.0-alpha.4.21-GUI-ASYNC-PERMISSION-GUARD-STAGING.jar | awk '{print $1}')" = "$(cut -d' ' -f1 test-assets/Nullgate.sha256)"
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullgate-offline-qa
          path: |
            integrity-report.json
            ci-qa/Nullgate-alpha421-source/qa/*.txt
            ci-qa/Nullgate-alpha421-source/qa/*.json
          if-no-files-found: ignore
          retention-days: 7
  purpur-boot:
    name: Purpur 1.21.11 / Java 25 startup and ABI smoke
    needs: [jar-and-offline-qa]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Retrieve EXACT Purpur 1.21.11 build 2568
        shell: bash
        run: |
          curl --fail --location --show-error --retry 3 --max-time 120 \
            'https://api.purpurmc.org/v2/purpur/1.21.11/2568/download' --output purpur.jar
          unzip -tqq purpur.jar
          sha256sum purpur.jar
      - name: Install verified PacketEvents Spigot 2.13.0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-assets/dependencies
          curl --fail --location --show-error --retry 3 --max-time 120 \
            'https://github.com/retrooper/packetevents/releases/download/v2.13.0/packetevents-spigot-2.13.0.jar' \
            --output test-assets/dependencies/packetevents-spigot-2.13.0.jar
          echo '6d9ece0d87ee727a79a20b7ffbd432021609c6f52bafcb654fc2d3e9b6f064c5  test-assets/dependencies/packetevents-spigot-2.13.0.jar' | sha256sum --check --status
          unzip -tqq test-assets/dependencies/packetevents-spigot-2.13.0.jar
      - name: Launch disposable loopback-only server
        run: python3 scripts/smoke.py --server purpur.jar --runtime runtime --max-wait 240 --soak 60
      - name: Retain startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullgate-purpur-boot
          path: |
            smoke-report.json
            runtime/ci-console.log
            runtime/logs/latest.log
          if-no-files-found: ignore
          retention-days: 7
  opt-in-self-hosted-soak:
    name: Isolated self-hosted soak (manual opt-in only)
    if: github.event_name == 'workflow_dispatch' && inputs.run_self_hosted == true
    needs: [purpur-boot]
    runs-on: [self-hosted, linux, x64, nullgate-lab]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Retrieve exact Purpur 1.21.11 build 2568
        shell: bash
        run: |
          curl --fail --location --show-error --retry 3 --max-time 120 \
            'https://api.purpurmc.org/v2/purpur/1.21.11/2568/download' --output purpur.jar
          unzip -tqq purpur.jar
      - name: Full dependency gate and 1-hour idle soak
        run: python3 scripts/smoke.py --server purpur.jar --runtime runtime --max-wait 300 --soak 3600 --strict-dependencies
      - name: Retain sanitized self-hosted summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nullgate-isolated-soak-summary
          path: smoke-report.json
          if-no-files-found: ignore
          retention-days: 7
